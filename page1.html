<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login</title>
    <link rel="stylesheet" href="page1.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Restaurant</h1>
        <div class="tab-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="showForm('customer')">Customer Login</button>
                <button class="tab-btn" onclick="showForm('admin')">Admin Login</button>
            </div>

            <div class="form-container">
                <!-- Customer Login -->
                <form id="customer" class="login-box active" action="#" method="post">
                    <label for="custName">Name</label>
                    <input type="text" id="custName" name="custName" placeholder="Enter your name" required>

                    <label for="custPhone">Phone</label>
                    <input type="tel" id="custPhone" name="custPhone" placeholder="Enter your phone number" required>

                    <label for="custEmail">Email</label>
                    <input type="email" id="custEmail" name="custEmail" placeholder="Enter your email" required>

                    <button type="submit">Login</button>
                </form>

                <!-- Admin Login -->
                <form id="admin" class="login-box" action="#" method="post">
                    <label for="adminUser">Username</label>
                    <input type="text" id="adminUser" name="adminUser" placeholder="Enter your username" required>

                    <label for="adminPass">Password</label>
                    <input type="password" id="adminPass" name="adminPass" placeholder="Enter your password" required>

                    <button type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function showForm(formId) {
            // Hide all forms
            document.querySelectorAll('.login-box').forEach(form => form.classList.remove('active'));
            // Remove active from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // Show selected form
            document.getElementById(formId).classList.add('active');
            // Activate the clicked tab button
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
